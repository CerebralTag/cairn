# Runs nginx serving the built app. In Synology Container Manager this can be created
# as a "Project" pointing at this folder. Put the contents of `dist/` in ./site next
# to this file (scripts/deploy.sh does that for you).
services:
  cairn:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      # Only this machine can reach it directly, so it is served to your devices through
      # HTTPS (e.g. `tailscale serve`) and not also over plain http on your home network.
      # To test it from another device on the LAN without HTTPS, change this to "8080:80".
      - "127.0.0.1:8080:80" # change the 8080 if it is taken
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
