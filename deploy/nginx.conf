# Serves the built app (the `dist/` folder) as plain static files.
# There is no backend: the app keeps its data in the browser.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The page and the service worker must always be re-checked, or an old copy of the
  # app can stick around on installed phones. The hashed files under /assets never
  # change once published, so they can be cached for a year.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js      { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
  location /assets/      { add_header Cache-Control "public, max-age=31536000, immutable"; }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
